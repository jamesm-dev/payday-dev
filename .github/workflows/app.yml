# The Payday app in app/: install, lint, typecheck, test, build on every push and pull request.
# Nothing here deploys. Netlify deploys only when the `deploy` branch is pushed, which the owner
# does on purpose to stay within the free credits (app/README.md, "Production").
# tateru's own self-test is selftest.yml and is separate.
name: app

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  checks:
    name: install, lint, typecheck, test, build (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from packageManager in app/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      # Node 24 is what Netlify runs in production (netlify.toml), so it gets every check.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm e2e:browsers --with-deps
      - run: pnpm test:e2e
      # The Netlify output, as a deploy would build it.
      - run: pnpm build
      # Calls the built Netlify function: headers, redirects and the unreachable-database page.
      - run: pnpm test:netlify
      - name: Keep the JUnit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/reports/

  unit-node-26:
    name: unit tests (Node 26, local development)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      # Development runs the version in app/.nvmrc.
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
